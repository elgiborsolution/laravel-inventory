name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    name: Distribution tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -p 'test_distribution.py'

  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '9'
            testbench: '^7.0'
            pest: '^1.23.1'
            larastan: '^2.11'
          - php: '8.2'
            laravel: '10'
            testbench: '^8.0'
            pest: '^2.36.1'
            larastan: '^2.11'
          - php: '8.2'
            laravel: '11'
            testbench: '^9.0'
            pest: '^3.8'
            larastan: '^2.11'
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
            pest: '^3.8'
            larastan: '^3.10'
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
            pest: '^4.7'
            larastan: '^3.10'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select framework-compatible development tools
        run: >-
          composer require --dev --no-update
          "orchestra/testbench:${{ matrix.testbench }}"
          "pestphp/pest:${{ matrix.pest }}"
          "larastan/larastan:${{ matrix.larastan }}"

      # Compatibility coverage only: keep these findings visible in composer audit.
      # Legacy audit.ignore is also supported by Composer's newer policy config.
      - name: Allow known Laravel 9 advisories for compatibility testing
        if: matrix.laravel == '9'
        run: >-
          composer config --json audit.ignore
          '{
            "PKSA-d5tc-s1qs-h781": {"apply": "block", "reason": "Laravel 9 compatibility CI only; not a production exception."},
            "PKSA-m5cs-t1y6-qpcs": {"apply": "block", "reason": "Laravel 9 compatibility CI only; not a production exception."},
            "PKSA-3r5d-mb8f-1qw9": {"apply": "block", "reason": "Laravel 9 compatibility CI only; not a production exception."},
            "PKSA-mdq4-51ck-6kdq": {"apply": "block", "reason": "Laravel 9 compatibility CI only; not a production exception."},
            "PKSA-8qx3-n5y5-vvnd": {"apply": "block", "reason": "Laravel 9 compatibility CI only; not a production exception."},
            "PKSA-w7xr-vk7n-rstm": {"apply": "block", "reason": "Laravel 9 compatibility CI only; not a production exception."}
          }'

      # Use the latest Laravel 11 patch line; do not exempt advisories fixed there.
      - name: Configure Laravel 11 legacy compatibility testing
        if: matrix.laravel == '11'
        run: |
          composer require --dev --no-update "laravel/framework:^11.57"
          composer config --json audit.ignore '{"PKSA-d5tc-s1qs-h781":{"apply":"block","reason":"Laravel 11 compatibility CI only; not a production exception."},"PKSA-m5cs-t1y6-qpcs":{"apply":"block","reason":"Laravel 11 compatibility CI only; not a production exception."},"PKSA-3r5d-mb8f-1qw9":{"apply":"block","reason":"Laravel 11 compatibility CI only; not a production exception."},"PKSA-mdq4-51ck-6kdq":{"apply":"block","reason":"Laravel 11 compatibility CI only; not a production exception."}}'

      - name: Select Laravel 9 compatible PHPUnit and configuration
        if: matrix.laravel == '9'
        run: |
          composer require --dev --no-update "phpunit/phpunit:^9.6.34"
          cp phpunit9.xml.dist phpunit.xml

      # Laravel 10 runs on PHP 8.2; let Pest select a compatible PHPUnit patch.
      - name: Configure Laravel 10 framework and PHPUnit compatibility
        if: matrix.laravel == '10'
        run: |
          composer require --dev --no-update "laravel/framework:^10.50.3"
          # Composer does not support writing individual audit.ignore.<ID> keys.
          # Merge into the existing map so Laravel advisory exceptions survive.
          php <<'PHP'
          <?php
          $path = 'composer.json';
          $manifest = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          // Only advisories still affecting the selected Laravel 10 patch line.
          // Older, fixed Laravel advisories are intentionally not exempted.
          foreach (['PKSA-d5tc-s1qs-h781', 'PKSA-m5cs-t1y6-qpcs', 'PKSA-3r5d-mb8f-1qw9', 'PKSA-mdq4-51ck-6kdq'] as $id) {
              $manifest['config']['audit']['ignore'][$id] = [
                  'apply' => 'block',
                  'reason' => 'Laravel 10 compatibility CI only; not a production exception.',
              ];
          }
          file_put_contents($path, json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          PHP

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate package
        run: composer validate --strict

      - name: Audit dependencies
        id: audit
        continue-on-error: ${{ (matrix.laravel == '9' || matrix.laravel == '10' || matrix.laravel == '11') && !startsWith(github.ref, 'refs/tags/') }}
        run: composer audit --locked

      - name: Report legacy compatibility audit findings
        if: (matrix.laravel == '9' || matrix.laravel == '10' || matrix.laravel == '11') && steps.audit.outcome == 'failure'
        run: echo "::warning::Legacy dependency audit failed. This job checks compatibility only; release-tag audits remain blocking."

      - name: Test
        run: composer test

      - name: Verify generated reference
        run: composer docs:check

      - name: Reject release tags with open blockers
        if: startsWith(github.ref, 'refs/tags/')
        run: composer release:preflight

      - name: Static analysis
        run: composer analyse

  style:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer audit --locked
      - run: composer format:check
